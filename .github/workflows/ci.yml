name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Format the ephemeral CI checkout first so compilation is not blocked by style-only diffs.
      # We will restore fmt --check once the current source tree has been normalized.
      - run: cargo fmt --all
      - run: cargo check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
