[package]
name = "mobile-acquire"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Standalone forensic-first Android and iOS acquisition orchestrator"
repository = "https://github.com/biancanik-art/Mobile_Forensics"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
